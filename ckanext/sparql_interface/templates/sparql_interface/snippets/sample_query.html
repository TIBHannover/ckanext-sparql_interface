<!--Find Datasets by InChiKey in DCAT_AP_PLUS Data-->
<textarea id="find_datasets_by_ikey_text" style="display:none">
    # Look up datasets for one or more InChIKeys
PREFIX dcat:   <http://www.w3.org/ns/dcat#>
PREFIX dct:    <http://purl.org/dc/terms/>
PREFIX prov:   <http://www.w3.org/ns/prov#>
PREFIX cheminf:<http://semanticscience.org/resource/CHEMINF_>

SELECT DISTINCT ?inchikey ?ds ?title ?formula
WHERE {
  VALUES ?inchikey {
    "QFCORKHZKILASC-UHFFFAOYSA-N"   # example from your Chemotion TTL
    # "XXXXXXXXXXXXXX-UHFFFAOYSA-N"  # add more if you like
  }

  ?ds a dcat:Dataset ;
      dct:title ?title ;
      dct:relation ?sample .

  # Sample carries CHEMINF annotations as dct:relation blank nodes
  ?sample dct:relation ?annKey .
  ?annKey a cheminf:000059 ;               # InChIKey
          prov:value ?inchikey .

  OPTIONAL {
    ?sample dct:relation ?annFormula .
    ?annFormula a cheminf:000037 ;         # IUPAC chemical formula
               prov:value ?formula .
  }
}
ORDER BY ?inchikey ?title

 </textarea>

<textarea id="find_datasets_by_ikey_two_text" style="display:none">
PREFIX prop: <https://service.tib.eu/sfb1153/wiki/Property-3A>
  PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
  SELECT ?property ?value
  WHERE {
    BIND(<https://service.tib.eu/sfb1153/wiki/M0046> AS ?sample)
    {
      ?sample ?property ?value .
      FILTER(?property IN (
        rdfs:label,
        prop:HasBatchNumber, prop:HasMaterialCombination, prop:CreatedBySubproject,
        prop:HasSampleMaterial, prop:HasUniqueSampleIdentifier,
        prop:RepresentsDemonstrator, prop:CreatedByPerson
      ))
    }
    UNION
    {
      ?protocol prop:AppliedOnSample ?sample .
      BIND("relatedProtocol" AS ?property)
      BIND(STR(?protocol) AS ?value)
    }
    UNION
    {
      ?protocol prop:AppliedOnSample ?sample .
      ?protocol prop:DataResourceUrl ?url .
      FILTER(REGEX(STR(?url), "/dataset/([0-9a-f-]{36})/resource/"))
      BIND(IRI(CONCAT("https://service.tib.eu/dataset/",
            REPLACE(STR(?url), "^.*/dataset/([0-9a-f-]{36})/resource/.*$", "$1"))) AS ?datasetIRI)
      SERVICE <https://service.tib.eu/lablsk-sparql/fuseki/ckan1153-2025/query> {
        ?datasetIRI ?property ?value .
        FILTER(?property != <http://www.w3.org/ns/dcat#distribution>)
      }
    }
  }
</textarea>
