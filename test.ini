[DEFAULT]
debug = false
smtp_server = localhost
error_email_from = ckan@localhost

[server:main]
use = egg:Paste#http
host = 0.0.0.0
port = 5000

[app:main]
use = config:../ckan/test-core.ini
ckan.plugins = sparql_interface datastore
sqlalchemy.url = postgresql://ckan:ckan@db/ckan_test
ckan.datastore.write_url = postgresql://ckan:ckan@db/datastore_test
ckan.datastore.read_url = postgresql://datastore_ro:datastore@db/datastore_test
solr_url = http://solr:8983/solr/ckan
ckan.redis.url = redis://redis:6379/1
ckanext.sparql_interface.endpoint_url = https://dbpedia.org/sparql
ckanext.sparql_interface.endpoints = DBpedia|https://dbpedia.org/sparql
ckanext.sparql_interface.hide_endpoint_url = false


# Logging configuration

[loggers]
keys = root, ckan, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_ckan]
qualname = ckan
handlers =
level = INFO

[logger_sqlalchemy]
handlers =
qualname = sqlalchemy.engine
level = WARN

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
